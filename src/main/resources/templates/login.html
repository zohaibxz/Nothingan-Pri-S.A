<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión de Prueba</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .error { color: #e74c3c; margin-bottom: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acceso de Prueba</h2>
        
        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Usuario / Email:</label>
                <input type="text" name="email" value="root" required>
            </div>
            
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" name="password" placeholder="Ingresa 123456" required>
            </div>

            <div class="form-group">
                <label>Probar vista de:</label>
                <select name="rol">
                    <option value="administrador">Administrador</option>
                    <option value="agent">Agente</option>
                    <option value="client">Cliente</option>
                </select>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
