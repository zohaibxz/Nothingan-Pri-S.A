<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Inici de sessió · Nothingan Pri</title>
        <style>
            :root {
                --fons-pagina: #f6f7f9;
                --fons-targeta: #faf9f6;
                --text: #1f2a44;
                --text-suau: #8a90a0;
                --vora: #e3e4e8;
                --primari: #335ec7;
                --primari-fosc: #2a4fab;
                --error: #b3261e;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
                background: var(--fons-pagina);
                color: var(--text);
            }
            .targeta {
                min-height: 100vh;
                background: var(--fons-targeta);
                padding: 64px 24px 48px;
                display: flex;
                justify-content: center;
            }
            .login {
                width: 100%;
                max-width: 480px;
                text-align: center;
            }
            .login .logo {
                height: 52px;
                width: auto;
            }
            .empresa {
                margin: 22px 0 32px;
                font-size: .8rem;
                letter-spacing: .01em;
                text-transform: uppercase;
                color: var(--text);
            }
            h1 {
                margin: 0 0 10px;
                font-size: 2.1rem;
                font-weight: 700;
                color: var(--text);
            }
            .subtitol {
                margin: 0 0 40px;
                font-size: .85rem;
                color: var(--text-suau);
            }

            form {
                text-align: left;
            }
            .camp {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-bottom: 20px;
            }
            label {
                font-size: .8rem;
                font-weight: 600;
                color: var(--text);
            }
            input[type="email"], input[type="password"], input[type="text"] {
                width: 100%;
                padding: 15px 14px;
                border: 1px solid var(--vora);
                border-radius: 8px;
                background: #fff;
                font: inherit;
                font-size: .85rem;
                color: var(--text);
            }
            input::placeholder {
                color: #a3a8b5;
            }
            input:focus {
                outline: 3px solid rgba(51, 94, 199, .3);
                outline-offset: 1px;
                border-color: var(--primari);
            }

            button.entrar {
                width: 100%;
                margin-top: 4px;
                padding: 16px;
                border: 0;
                border-radius: 8px;
                background: var(--primari);
                color: #fff;
                font: inherit;
                font-size: .9rem;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }
            button.entrar:hover {
                background: var(--primari-fosc);
            }
            button.entrar svg {
                width: 16px;
                height: 16px;
            }

            .missatge {
                border-radius: 8px;
                padding: 10px 12px;
                margin-bottom: 20px;
                font-size: .8rem;
                text-align: left;
            }
            .missatge.error {
                background: #fdecea;
                color: var(--error);
                border: 1px solid #f3c1bd;
            }
            .missatge.ok {
                background: #e8f3ea;
                color: #1f6b34;
                border: 1px solid #bfdcc6;
            }

            .enllacos {
                margin-top: 36px;
                font-size: .75rem;
                color: var(--text-suau);
            }
            .enllacos p {
                margin: 0 0 22px;
            }
            .enllacos a {
                color: var(--primari);
                font-weight: 600;
                text-decoration: none;
            }
            .enllacos a:hover {
                text-decoration: underline;
            }
            .tornar {
                display: block;
                text-align: left;
                margin-bottom: 24px;
                font-size: .85rem;
                font-weight: 600;
                color: var(--primari);
                text-decoration: none;
            }
            .tornar:hover {
                text-decoration: underline;
            }
        </style>
        <link rel="stylesheet" th:href="@{/css/tema-crema.css}">
    </head>
    <body>
        <div class="targeta">
            <main class="login">

                <!-- Tornar a la pàgina inicial (inici-client) -->
                <a class="tornar" th:href="@{/}">← Tornar</a>

                <!-- Missatge quan es fa un logout correcte -->
                <div th:if="${param.logout}" style="background: #e6f4ec; color: #1e7a4a; padding: 12px; border-radius: 8px; margin-bottom: 16px;">
                    Has tancat la sessió correctament.
                </div>

                <!-- Missatge quan el correu o la contrasenya són incorrectes -->
                <div th:if="${param.error}" style="background: #fde8e8; color: #b42318; padding: 12px; border-radius: 8px; margin-bottom: 16px;">
                    El correu electrònic o la contrasenya són incorrectes.
                </div>


                <img class="logo" th:src="@{/img/logo.jpg}" alt="Logotip de Nothingan Pri">
                <p class="empresa">Nothingan Pri S.A.</p>

                <h1>Inici de sessió</h1>
                <p class="subtitol">Accedeix al teu compte</p>

                <!-- Missatges de Spring Security -->
                <div class="missatge error" th:if="${param.error}" role="alert">
                    Correu electrònic o contrasenya incorrectes.
                </div>
                <div class="missatge ok" th:if="${param.logout}">
                    Has tancat la sessió correctament.
                </div>

                <!-- Spring Security espera per defecte els camps "username" i "password" -->
                <form th:action="@{/login}" method="post">
                    <div class="camp">
                        <label for="email">Correu electrònic</label>
                        <input type="email" id="email" name="email"
                               placeholder="Introdueix el teu correu"
                               autocomplete="email" required autofocus>
                    </div>

                    <div class="camp">
                        <label for="password">Contrasenya</label>
                        <input type="password" id="password" name="password"
                               placeholder="••••••••••••"
                               autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="entrar">
                        <span>Iniciar sessió</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>

                <div class="enllacos">
                    <p>No tens un compte? <a th:href="@{/client/alta}">Registra't</a></p>
                </div>


            </main>
        </div>
        <script th:src="@{/js/np-fluidesa.js}" defer></script>
    </body>
</html>
