<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <body>

        <!-- Capçalera comuna de les pàgines de reserves del client.
             actiu = 'nova' o 'reserves' (per marcar l'enllaç de la pàgina actual). -->
        <header th:fragment="capcalera(actiu)">
            <a class="brand" th:href="@{/}">
                <img src="../../static/img/logo.jpg" th:src="@{/img/logo.jpg}" alt="Logo Nothingan Pri">
                <span>Nothingan Pri</span>
            </a>
            <nav class="header-right" aria-label="Navegació principal">
                <a th:href="@{/dashboard(rol='client')}">Inici</a>
                <a th:href="@{/client/reserva/nueva}" th:classappend="${actiu == 'nova'} ? 'actiu'"
                   th:attr="aria-current=${actiu == 'nova'} ? 'page'">Nova reserva</a>
                <a th:href="@{/client/reserves}" th:classappend="${actiu == 'reserves'} ? 'actiu'"
                   th:attr="aria-current=${actiu == 'reserves'} ? 'page'">Les meves reserves</a>
                <!-- Vehicles (RF14) i Contacte encara no tenen pàgina: s'afegiran quan existeixin -->
                <a th:href="@{/logout}">Tanca la sessió</a>
            </nav>
        </header>

        <!-- Peu comú -->
        <footer th:fragment="peu">
            <span th:text="'© ' + ${#temporals.year(#temporals.createNow())} + ' Nothingan Pri. Tots els drets reservats.'">
                © 2026 Nothingan Pri. Tots els drets reservats.
            </span>
            <span>Català · CA</span>
        </footer>

    </body>
</html>
