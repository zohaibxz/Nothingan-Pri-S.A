<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" th:href="@{/css/tema-crema.css}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inici · Nothingan Pri</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #faf9f6;
            --text: #1f2a44;
            --muted: #6b7280;
            --primary: #3a5fd0;
            --primary-dark: #2f4fb3;
            --border: #e5e3de;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }

        /* Capçalera */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 56px;
            border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 16px; }
        .brand img { height: 40px; width: auto; }
        .brand span { font-size: 1.6rem; font-weight: 700; }
        .header-right { display: flex; align-items: center; font-size: .95rem; }
        .header-right .contact { color: var(--primary); font-weight: 500; padding-right: 14px; }
        .header-right .lang {
            color: var(--muted);
            padding-left: 14px;
            border-left: 1px solid var(--border);
        }

        /* Hero */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 426px;
            align-items: center;
            gap: 60px; justify-content: space-between;
            padding: 40px 56px 40px 56px;
            width: 100%;
        }
        .eyebrow {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
            font-size: .78rem;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .eyebrow::before {
            content: "";
            width: 24px;
            height: 2px;
            background: var(--primary);
        }
        h1 {
            font-size: clamp(2.2rem, 3.6vw, 2.9rem);
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: -.02em;
            margin-bottom: 22px;
        }
        .lead {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
            max-width: 560px;
            margin-bottom: 32px;
        }
        .actions { display: flex; gap: 14px; margin-bottom: 18px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid transparent;
            transition: background .15s, box-shadow .15s;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: #fff; color: var(--primary); border-color: var(--border); }
        .btn-outline:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
        .hint { color: var(--muted); font-size: .9rem; }

        .hero-img { display: flex; justify-content: flex-end; }
        .hero-img img {
            width: 100%;
            max-width: 426px;
            aspect-ratio: 426 / 450;
            object-fit: cover;
            border-radius: 72px;
            display: block;
        }

        /* Peu */
        footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 56px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: .85rem;
        }
        footer nav { display: flex; gap: 28px; }
        footer a:hover { color: var(--text); }

        /* Responsiu */
        @media (max-width: 860px) {
            header, footer { padding: 18px 24px; }
            main { grid-template-columns: 1fr; justify-content: stretch; padding: 32px 24px; gap: 36px; }
            .hero-img { justify-content: center; order: -1; }
            .actions { flex-wrap: wrap; }
            footer { flex-direction: column; gap: 12px; }
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/tema-crema.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: capcalera('inici')}"></div>

<main>
    <section>
        <div class="eyebrow">Lloguer de cotxes</div>
        <h1>El teu proper trajecte<br>comença aquí.</h1>
        <p class="lead">
            Benvingut a Nothingan Pri. Troba el cotxe per als teus plans i gestiona els teus lloguers des d'un mateix lloc.
        </p>

        <div class="actions">
            <a class="btn btn-primary" th:href="@{/login}">
                <span>Iniciar sessió</span>
                <span aria-hidden="true">→</span>
            </a>
            <a class="btn btn-outline" th:href="@{/client/alta}">Registrar-se</a>
        </div>
        <p class="hint">Accedeix al teu compte o crea'n un per començar.</p>
    </section>

    <section class="hero-img">
        <img th:src="@{/img/cotxe.jpg}" alt="Cotxe de lloguer en moviment">
    </section>
</main>

<div th:replace="~{fragments/layout :: peu}"></div>

</body>
</html>
