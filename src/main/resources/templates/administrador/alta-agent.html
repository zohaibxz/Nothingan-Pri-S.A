<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alta d'Agent</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 20px; }
        .form-card { background: white; padding: 25px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #8e44ad; margin-bottom: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 12px; }
        .full-width { grid-column: span 2; }
        label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background: #8e44ad; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .btn-cancel { display: block; text-align: center; margin-top: 10px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Registre Usuari</h2>

    <form th:action="@{/admin/agent/alta}" th:object="${agent}" method="post">
        <div class="grid">
            
            <!-- DNI -->
            <div class="form-group">
                <label>DNI / NIE:</label>
                <input type="text" th:field="*{dniUsuari}" placeholder="12345678X" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Correu Electrònic:</label>
                <input type="email" th:field="*{email}" placeholder="agent@empresa.com" required>
            </div>

            <!-- Nom -->
            <div class="form-group">
                <label>Nom:</label>
                <input type="text" th:field="*{nom}" required>
            </div>

            <!-- Cognoms -->
            <div class="form-group">
                <label>Cognoms:</label>
                <input type="text" th:field="*{cognoms}" required>
            </div>

            <!-- Contrasenya -->
            <div class="form-group full-width">
                <label>Contrasenya:</label>
                <input type="password" th:field="*{passwordHash}" required>
            </div>

            <!-- Adreça -->
            <div class="form-group">
                <label>Adreça:</label>
                <input type="text" th:field="*{adreca}" required>
            </div>

            <!-- Nacionalitat -->
            <div class="form-group">
                <label>Nacionalitat:</label>
                <input type="text" th:field="*{nacionalitat}" required>
            </div>

            <!-- Caducitat DNI -->
            <div class="form-group">
                <label>Caducitat DNI:</label>
                <input type="date" th:field="*{dataCaducitatDni}" required>
            </div>

            <!-- Tipus Llicència -->
            <div class="form-group">
                <label>Tipus Llicència:</label>
                <input type="text" th:field="*{tipusLlicencia}" placeholder="B" required>
            </div>

            <!-- Caducitat Llicència -->
            <div class="form-group">
                <label>Caducitat Llicència:</label>
                <input type="date" th:field="*{dataCaducitatLlicencia}" required>
            </div>

            <!-- Targeta Crèdit -->
            <div class="form-group">
                <label>Targeta de Crèdit (Luhn):</label>
                <input type="text" th:field="*{numTargetaCredit}" placeholder="4532000000000000" required>
            </div>

            <!-- Rol -->
            <div class="form-group full-width">
                <label>Rol de l'Usuari:</label>
                <select th:field="*{rol}">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>

        </div>

        <button type="submit" class="btn-submit">Guardar Agent</button>
        <a th:href="@{/dashboard?rol=administrador}" class="btn-cancel">Cancel·lar</a>
    </form>
</div>

</body>
</html>
