
<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Penjar documentació · Nothingan Pri</title>


    <style>
        body {
            margin: 0;
            padding: 2rem 1rem;
        }

        .form-card {
            max-width: 600px;
            margin: auto;
            padding: 2rem;
            border: 1px solid #e6e3dc;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,.07);
        }

        h1 {
            margin: 0 0 20px;
            text-align: center;
            font-size: 1.5rem;
        }

        .subtitol {
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #e6e3dc;
            border-radius: 8px;
            background: #fff;
        }

        .hint {
            font-size: .8rem;
            margin-top: 5px;
        }

        .error {
            color: #991b1b;
            background: #fee2e2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .btn-submit {
            border: 0;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #2a3ea6;
            text-decoration: underline;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/tema-crema.css}">
</head>

<body>

    <div th:replace="~{fragments/layout :: capcalera('clients')}"></div>
    <main class="form-card">

        <h1>Documentació de l'usuari</h1>

        <p class="subtitol">
            <span th:text="${nomComplet}">Nom Cognoms</span>
            - DNI:
            <strong th:text="${dni}">12345678X</strong>
        </p>

        <div class="error"
             role="alert"
             th:if="${error}"
             th:text="${error}">
        </div>

        <form enctype="multipart/form-data"
              method="post"
              th:action="@{/admin/agent/{dni}/documentacio(dni=${dni})}">

            <div class="form-group">

                <label for="identitat">
                    Document d'identitat (DNI / NIE / Passaport)
                </label>

                <input id="identitat"
                       type="file"
                       name="identitat"
                       accept=".pdf,.jpg,.jpeg,.png"
                       required>

                <div class="hint">
                    PDF, JPG o PNG · màxim 5 MB
                </div>

            </div>

            <div class="form-group">

                <label for="carnet">
                    Carnet de conduir
                </label>

                <input id="carnet"
                       type="file"
                       name="carnet"
                       accept=".pdf,.jpg,.jpeg,.png"
                       required>

                <div class="hint">
                    PDF, JPG o PNG · màxim 5 MB
                </div>

            </div>

            <button class="btn-submit" type="submit">
                Enviar documentació
            </button>

            <a class="btn-cancel"
               th:href="@{/admin/agent/validacions/{dni}/revisa(dni=${dni})}">
                Cancel·lar
            </a>

        </form>

    </main>

    <div th:replace="~{fragments/layout :: peu}"></div>

</body>
</html>
