<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjar documentació · Nothingan Pri</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <link rel="stylesheet" th:href="@{/css/tema-crema.css}">
</head>

<body class="bg-[#F8F6F1] text-slate-700 min-h-screen flex flex-col justify-between font-sans antialiased">

    <div>
        <div th:replace="~{fragments/layout :: capcalera('clients')}"></div>

        <main class="max-w-3xl mx-auto px-6 py-8 space-y-6">

            <!-- Enllaç per tornar a la fitxa de l'usuari (mateix patró que revisar-documentacio-client) -->
            <a th:href="@{/admin/agent/validacions/{dni}/revisa(dni=${dni})}"
               class="text-xs font-semibold text-slate-500 hover:text-blue-600 inline-flex items-center space-x-1.5">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                <span>Tornar a la fitxa de l'usuari</span>
            </a>

            <!-- TÍTOL -->
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Documentació de l'usuari</h1>
                <p class="text-slate-500 text-sm mt-0.5">Penja el document d'identitat i el carnet de conduir.</p>
            </div>

            <!-- DADES DE L'USUARI -->
            <section aria-label="Dades de l'usuari" class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                <p class="font-bold text-slate-900 text-base" th:text="${nomComplet}">Nom Cognoms</p>
                <p class="mt-2 text-xs">
                    <span class="text-slate-400">DNI:</span>
                    <span class="font-mono text-slate-700" th:text="${dni}">12345678X</span>
                </p>
            </section>

            <!-- ERROR DEL CONTROLADOR -->
            <div th:if="${error}" role="alert"
                 class="flex items-start gap-3 bg-rose-50 border border-rose-200 text-rose-800 text-sm rounded-lg px-4 py-3">
                <i class="fa-solid fa-circle-exclamation mt-0.5" aria-hidden="true"></i>
                <span th:text="${error}">Error</span>
            </div>

            <!-- FORMULARI -->
            <form enctype="multipart/form-data"
                  method="post"
                  th:action="@{/admin/agent/{dni}/documentacio(dni=${dni})}"
                  class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">

                <div class="p-5 border-b border-slate-100">
                    <h2 class="font-bold text-slate-900 text-base">Documents</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Si l'usuari ja en tenia, es substituiran pels nous.</p>
                </div>

                <div class="px-5 py-5 space-y-5">

                    <div>
                        <label for="identitat" class="block text-xs font-semibold text-slate-500 mb-1">
                            Document d'identitat (DNI / NIE / Passaport)
                        </label>
                        <input id="identitat"
                               type="file"
                               name="identitat"
                               accept=".pdf,.jpg,.jpeg,.png"
                               required
                               class="block w-full text-sm text-slate-700 border border-slate-200 rounded-lg bg-white cursor-pointer
                                      file:mr-3 file:py-2 file:px-3 file:border-0 file:border-r file:border-slate-200
                                      file:bg-slate-50 file:text-xs file:font-semibold file:text-slate-700 hover:file:bg-slate-100">
                        <p class="hint text-[11px] mt-1">PDF, JPG o PNG · màxim 5 MB</p>
                    </div>

                    <div>
                        <label for="carnet" class="block text-xs font-semibold text-slate-500 mb-1">
                            Carnet de conduir
                        </label>
                        <input id="carnet"
                               type="file"
                               name="carnet"
                               accept=".pdf,.jpg,.jpeg,.png"
                               required
                               class="block w-full text-sm text-slate-700 border border-slate-200 rounded-lg bg-white cursor-pointer
                                      file:mr-3 file:py-2 file:px-3 file:border-0 file:border-r file:border-slate-200
                                      file:bg-slate-50 file:text-xs file:font-semibold file:text-slate-700 hover:file:bg-slate-100">
                        <p class="hint text-[11px] mt-1">PDF, JPG o PNG · màxim 5 MB</p>
                    </div>

                </div>

                <div class="px-5 py-4 bg-slate-50 border-t border-slate-100 flex items-center gap-3">
                    <button type="submit"
                            class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg shadow-sm transition flex items-center space-x-2">
                        <i class="fa-solid fa-upload" aria-hidden="true"></i>
                        <span>Enviar documentació</span>
                    </button>
                    <a th:href="@{/admin/agent/validacions/{dni}/revisa(dni=${dni})}"
                       class="text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 px-4 py-2.5 rounded-lg transition">
                        Cancel·la
                    </a>
                </div>

            </form>

        </main>
    </div>

    <div th:replace="~{fragments/layout :: peu}"></div>

</body>
</html>
