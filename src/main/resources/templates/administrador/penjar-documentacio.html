<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Penjar Documentació</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 20px; }
        .form-card { background: white; padding: 25px; border-radius: 8px; max-width: 600px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #8e44ad; margin-bottom: 20px; text-align: center; }
        .subtitol { text-align: center; color: #666; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 0.9rem; }
        input[type=file] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; background: #fafafa; }
        .hint { font-size: 0.8rem; color: #888; margin-top: 3px; }
        .error { color: #e74c3c; margin-bottom: 15px; font-size: 14px; text-align: center; }
        .btn-submit { background: #8e44ad; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .btn-cancel { display: block; text-align: center; margin-top: 10px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Documentació de l'Usuari</h2>
    <p class="subtitol">
        <span th:text="${nomComplet}">Nom Cognoms</span> -
        DNI: <strong th:text="${dni}">12345678X</strong>
    </p>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/admin/agent/{dni}/documentacio(dni=${dni})}"
          method="post" enctype="multipart/form-data">

        <div class="form-group">
            <label>Document d'identitat (DNI / NIE / Passaport):</label>
            <input type="file" name="identitat" accept=".pdf,.jpg,.jpeg,.png" required>
            <div class="hint">PDF, JPG o PNG · màxim 5 MB</div>
        </div>

        <div class="form-group">
            <label>Carnet de conduir:</label>
            <input type="file" name="carnet" accept=".pdf,.jpg,.jpeg,.png" required>
            <div class="hint">PDF, JPG o PNG · màxim 5 MB</div>
        </div>

        <button type="submit" class="btn-submit">Enviar Documentació</button>
        <a th:href="@{/admin/agent/validacions/{dni}/revisa(dni=${dni})}" class="btn-cancel">Cancel·lar</a>
    </form>
</div>

</body>
</html>
