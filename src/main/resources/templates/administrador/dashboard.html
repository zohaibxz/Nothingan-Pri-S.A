<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administrador</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .admin-bloc { border: 2px solid #8e44ad; background: #fdfafb; padding: 15px; margin-bottom: 20px; border-radius: 6px; }
        .seccio-bloc { border: 2px solid #bdc3c7; padding: 15px; margin-bottom: 20px; border-radius: 6px; }
        .card { border: 1px solid #ccc; padding: 10px; margin-top: 10px; border-radius: 4px; }
        .btn { display: inline-block; padding: 6px 12px; background: #8e44ad; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h1 style="color: #8e44ad;">Panel Global de Administración</h1>

    <!-- 1. REQUISITOS EXCLUSIVOS DE ADMINISTRADOR (RF20, RF29) -->
    <div class="admin-bloc">
        <h2>Sección Administrador (Requisitos Exclusivos)</h2>
        
        <!-- RF20: Eliminar vehicle sense reserves -->
        <div class="card">
            <h3>Eliminación Definitiva de Vehículos (RF20)</h3>
            <a href="/admin/vehicle/eliminar" class="btn">Eliminar vehículo sin reservas (RF20)</a>
        </div>

        <!-- RF29: Consultar informes -->
        <div class="card">
            <h3>Información Global y Reportes (RF29)</h3>
            <a href="/admin/informes" class="btn">Consultar informe de reservas realizadas (RF29)</a>
        </div>
    </div>

    <!-- 2. REQUISITOS HEREDADOS DE AGENTE (RF04, RF06, RF08, RF13...) -->
    <div th:replace="~{fragments/moduls-agent :: funcionsAgent}"></div>

    <!-- 3. REQUISITOS HEREDADOS DE CLIENTE (RF10, RF14, RF21...) -->
    <div th:replace="~{fragments/moduls-client :: funcionsClient}"></div>
    
    <!-- Sección CRUD Agents dentro de administrador/dashboard.html -->
    <div class="card">
        <h3>Gestió d'Agents</h3>
        <a th:href="@{/admin/agent/alta}" class="btn">Donar d'alta un nou agent</a>
    </div>

</body>
</html>
