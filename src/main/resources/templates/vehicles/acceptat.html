<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehicle acceptat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 2rem 1rem;
            color: #1f2937;
        }
        .card {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
            text-align: center;
        }
        .check {
            width: 72px;
            height: 72px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            font-size: 2.5rem;
            line-height: 72px;
        }
        h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
        .subtitle { color: #6b7280; margin-bottom: 1.5rem; }
        .resum {
            text-align: left;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .resum div {
            display: flex;
            justify-content: space-between;
            padding: .7rem 1rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .resum div:last-child { border-bottom: none; }
        .resum span:first-child { font-weight: 600; color: #4b5563; }
        .actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: .7rem 1.4rem;
            border-radius: 8px;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #e5e7eb; color: #1f2937; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✓</div>
        <h1>Vehicle acceptat</h1>
        <p class="subtitle">Les dades del vehicle s'han rebut correctament.</p>

        <div class="resum" th:if="${vehicle != null}">
            <div><span>Matrícula</span><span th:text="${vehicle.matricula}"></span></div>
            <div><span>Marca</span><span th:text="${vehicle.marca}"></span></div>
            <div><span>Model</span><span th:text="${vehicle.model}"></span></div>
            <div><span>Categoria</span><span th:text="${vehicle.categoria}"></span></div>
            <div><span>Any de fabricació</span><span th:text="${vehicle.any_fabricacio}"></span></div>
            <div><span>Preu diari</span><span th:text="${vehicle.preu_diari} + ' €'"></span></div>
            <div><span>Data d'alta</span><span th:text="${vehicle.data_alta}"></span></div>
        </div>

        <div class="actions">
            <a th:href="@{/vehicles/alta}" class="btn btn-primary">Donar d'alta un altre vehicle</a>
            <a th:href="@{/vehicles}" class="btn btn-secondary">Tornar a l'inici</a>
        </div>
    </div>
</body>
</html>
