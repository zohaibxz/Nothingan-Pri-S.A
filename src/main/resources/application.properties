spring.application.name=thymeleaf
spring.application.name=thymeleaf

spring.datasource.url=jdbc:mysql://localhost:3306/Projecte1_Equip5?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
# RN53: la contrasenya de la BD es pot passar per variable d'entorn (DB_PASSWORD) en lloc de deixar-la al codi
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

server.port=8080

# Pujada de fitxers privats dels vehicles
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# ---------------------------------------------------------------------
# RN53 / RN54: sessi\u00f3 i errors
# ---------------------------------------------------------------------
# La cookie de sessi\u00f3 no \u00e9s accessible des de JavaScript i no s'envia des d'altres webs
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# La sessi\u00f3 caduca als 30 minuts d'inactivitat
server.servlet.session.timeout=30m
# RN21 / RN53: mai es mostra la tra\u00e7a ni el missatge t\u00e8cnic de l'error al navegador
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# RN04: carpeta dels fitxers de log (la configuraci\u00f3 \u00e9s a logback-spring.xml)
# logging.file \u00e9s gestionat per logback-spring.xml; es pot canviar amb la variable d'entorn LOG_DIR

# RN54: per activar HTTPS arrenca l'aplicaci\u00f3 amb el perfil "https":
#   mvn spring-boot:run -Dspring-boot.run.profiles=https
# (vegeu application-https.properties)

# Connexi\u00f3 a MongoDB
spring.mongodb.uri=mongodb://localhost:27017/Projecte1_Equip5


