spring.application.name=projecte1-equip5
spring.profiles.default=https
spring.datasource.url=jdbc:mysql://localhost:3306/Projecte1_Equip5?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
# RN53: la contrasenya de la BD es pot passar per variable d'entorn (DB_PASSWORD) en lloc de deixar-la al codi
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

server.port=8080

spring.mongodb.uri=mongodb://localhost:27017/reserves_docs
spring.data.mongodb.database=reserves_docs
# la base de datos MongoDb
# Pujada de fitxers privats dels vehicles (fotos i documents, 5 MB per fitxer)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB


spring.data.mongodb.auto-index-creation=true
# Sin eso, nada impide en Mongo que un DNI tenga dos documentos. Hoy no da problemas, porque ya compruebas el DNI en MySQL antes de guardar.



# ---------------------------------------------------------------------
# RN53 / RN54: sessi\u00f3 i errors
# ---------------------------------------------------------------------
# La cookie de sessi\u00f3 no \u00e9s accessible des de JavaScript i no s'envia des d'altres webs
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# La sessi\u00f3 caduca als 30 minuts d'inactivitat
server.servlet.session.timeout=30m
# RN21 / RN53: mai es mostra la tra\u00e7a ni el missatge t\u00e8cnic de l'error al navegador
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# RN04: carpeta dels fitxers de log (la configuraci\u00f3 \u00e9s a logback-spring.xml)
# logging.file \u00e9s gestionat per logback-spring.xml; es pot canviar amb la variable d'entorn LOG_DIR

# RN54: per activar HTTPS arrenca l'aplicaci\u00f3 amb el perfil "https":
#   mvn spring-boot:run -Dspring-boot.run.profiles=https
# (vegeu application-https.properties)


# ---------------------------------------------------------------------
# Correu electr\u00c3\u00b2nic: av\u00c3\u00ads d'anul\u00c2\u00b7laci\u00c3\u00b3 de reserves (MailService)
# ---------------------------------------------------------------------
# Sense servidor SMTP l'aplicaci\u00c3\u00b3 funciona igual: el correu nom\u00c3\u00a9s es deixa al log.
# Per enviar-lo de deb\u00c3\u00b2, defineix les variables d'entorn MAIL_HOST, MAIL_USER i MAIL_PASSWORD
# i treu el # de les l\u00c3\u00adnies de sota. Exemple amb Gmail (cal una "contrasenya d'aplicaci\u00c3\u00b3"):
#   MAIL_HOST=smtp.gmail.com  MAIL_USER=el.teu.correu@gmail.com  MAIL_PASSWORD=<contrasenya d'aplicaci\u00c3\u00b3>
# spring.mail.host=${MAIL_HOST}
# spring.mail.port=587
# spring.mail.username=${MAIL_USER}
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# Remitent que veu el client (amb Gmail ha de ser el mateix compte que MAIL_USER)
app.mail.from=${MAIL_USER:no-reply@nothingan-pri.local}