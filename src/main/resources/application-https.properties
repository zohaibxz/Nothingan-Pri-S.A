# RN54: perfil HTTPS. Les dades entre el navegador i el servidor van xifrades (TLS).
# \u00das: mvn spring-boot:run -Dspring-boot.run.profiles=https
# Certificat de desenvolupament (una sola vegada, a l'arrel del projecte):
#   keytool -genkeypair -alias projecte1 -keyalg RSA -keysize 2048 -storetype PKCS12 \
#           -keystore keystore.p12 -validity 365 -dname "CN=localhost"
# La contrasenya del keystore NO es deixa aqu\u00ed: es passa amb la variable d'entorn SSL_KEYSTORE_PASSWORD.
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:./keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:prova1234}
server.ssl.key-alias=projecte1
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Nom\u00e9s s'accepten connexions HTTPS (WebSecurityConfig.requiresChannel) i la cookie de sessi\u00f3 nom\u00e9s viatja xifrada
app.https.obligatori=true
server.servlet.session.cookie.secure=true